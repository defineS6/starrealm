<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录</title>
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('nav-theme');
        var savedStyle = localStorage.getItem('nav-style');
        if (savedTheme === 'cyber') {
          savedStyle = 'cyber';
          savedTheme = 'dark';
          localStorage.setItem('nav-style', 'cyber');
          localStorage.setItem('nav-theme', 'dark');
        }
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var root = document.documentElement;
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
        root.classList.remove('omc', 'cyber');
        if (savedStyle === 'omc' || savedStyle === 'cyber') {
          root.classList.add(savedStyle);
        }
      } catch (e) {}
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
  <style>
    /* ===== 精修流体玻璃 Bento 登录页 ===== */
    :root {
      --font-stack: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Noto Sans SC', 'PingFang SC', 'Helvetica Neue', sans-serif;
      --lg-spring: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #e8eef7;
      background:
        radial-gradient(1200px circle at 12% 8%, rgba(224,231,255,0.75), transparent 55%),
        radial-gradient(1000px circle at 88% 92%, rgba(252,231,243,0.6), transparent 55%),
        #e8eef7;
      font-family: var(--font-stack);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: #1e293b;
      overflow: hidden;
      transition: background-color 0.35s ease, color 0.25s ease;
    }

    /* 环境极光弥散色球与点阵底纹 */
    .blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .blobs::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(15, 23, 42, 0.045) 1px, transparent 1px);
      background-size: 24px 24px;
      mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.65) 20%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.65) 20%, transparent 80%);
    }
    .blob { position: absolute; border-radius: 50%; filter: blur(95px); will-change: transform; }
    .blob-1 { width: 540px; height: 540px; top: -130px; right: -60px; background: radial-gradient(circle at 30% 30%, rgba(56,189,248,0.52), rgba(99,102,241,0.34) 58%, transparent 74%); animation: float1 26s ease-in-out infinite alternate; }
    .blob-2 { width: 460px; height: 460px; bottom: -120px; left: 4%; background: radial-gradient(circle at 40% 40%, rgba(168,85,247,0.44), rgba(244,114,182,0.28) 58%, transparent 74%); animation: float2 30s ease-in-out infinite alternate; }
    .blob-3 { width: 380px; height: 380px; top: 40%; left: 48%; background: radial-gradient(circle at 45% 45%, rgba(45,212,191,0.32), rgba(56,189,248,0.20) 58%, transparent 72%); animation: float3 22s ease-in-out infinite alternate; }
    @keyframes float1 { from { transform: translate(0,0) scale(1); } to { transform: translate(-55px,45px) scale(1.1); } }
    @keyframes float2 { from { transform: translate(0,0) scale(1); } to { transform: translate(65px,-45px) scale(1.08); } }
    @keyframes float3 { from { transform: translate(0,0) scale(1); } to { transform: translate(-40px,-55px) scale(0.94); } }

    /* 右上角主题切换浮钮 */
    .theme-switch {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      z-index: 10;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.72);
      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 4px 14px rgba(15,23,42,0.06);
      transition: transform 0.2s var(--lg-spring), background-color 0.2s;
    }
    .theme-switch:hover { background: rgba(255,255,255,0.82); }
    .theme-switch:active { transform: scale(0.96); }

    /* 登录 Bento 卡片 */
    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 390px;
      margin: 1rem;
      padding: 2rem 1.85rem 1.75rem;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.78);
      background: rgba(255,255,255,0.68);
      backdrop-filter: blur(36px) saturate(185%);
      -webkit-backdrop-filter: blur(36px) saturate(185%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.92),
        0 20px 50px -12px rgba(15,23,42,0.12),
        0 4px 12px rgba(15,23,42,0.04);
      animation: cardIn 0.4s var(--lg-spring);
    }
    @keyframes cardIn { from { opacity: 0; transform: translateY(18px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

    .login-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(135deg, rgba(255,255,255,0.58) 0%, rgba(255,255,255,0.12) 32%, transparent 62%);
    }

    .shield-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      margin: 0 auto 0.75rem;
      border-radius: 10px;
      background: #4f46e5;
      color: #ffffff;
      box-shadow: 0 6px 16px -3px rgba(79,70,229,0.4);
    }

    .eyebrow {
      display: flex;
      width: fit-content;
      margin: 0 auto 0.5rem;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(226,232,240,0.9);
      border-radius: 6px;
      background: rgba(255,255,255,0.7);
      padding: 0.2rem 0.6rem;
      color: #475569;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4f46e5;
    }

    .login-title {
      font-size: 1.6rem;
      font-weight: 700;
      text-align: center;
      margin: 0 0 0.35rem;
      color: #0f172a;
      letter-spacing: -0.01em;
    }
    .login-subtitle {
      text-align: center;
      font-size: 0.8rem;
      color: #64748b;
      margin: 0 0 1.5rem;
    }

    .form-group { margin-bottom: 1.05rem; }
    label {
      display: block;
      margin-bottom: 0.42rem;
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #475569;
    }

    .input-wrap { position: relative; display: flex; align-items: center; }
    .input-icon {
      position: absolute;
      left: 14px;
      width: 17px;
      height: 17px;
      color: #94a3b8;
      pointer-events: none;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 0.68rem 0.9rem 0.68rem 2.4rem;
      border: 1px solid rgba(203,213,225,0.9);
      border-radius: 8px;
      background: #ffffff;
      font-size: 0.88rem;
      font-family: inherit;
      color: #0f172a;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input::placeholder { color: #94a3b8; }
    input:focus {
      border-color: #4f46e5;
      background: #ffffff;
      outline: none;
      box-shadow: 0 0 0 3px rgba(79,70,229,0.15);
    }

    button[type="submit"] {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.72rem;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(79,70,229,0.25);
      transition: background-color 0.15s, transform 0.1s;
    }
    button[type="submit"]:hover {
      background: #4338ca;
    }
    button[type="submit"]:active { transform: scale(0.98); }
    button[type="submit"]:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(79,70,229,0.35); }

    .error-message {
      color: #b91c1c;
      background: #fee2e2;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 500;
      margin-top: 0.65rem;
      text-align: center;
      display: none;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      text-align: center;
      margin-top: 1.25rem;
      color: #64748b;
      text-decoration: none;
      font-size: 0.83rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    .back-link:hover { color: #0f172a; }

    /* 暗色模式：支持 html.dark 类 */
    html.dark body {
      background:
        radial-gradient(1200px circle at 15% 10%, rgba(49,46,129,0.35), transparent 55%),
        radial-gradient(1000px circle at 85% 90%, rgba(88,28,135,0.25), transparent 55%),
        #060913;
      color: #e2e8f0;
    }
    html.dark .blobs::after { background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px); }
    html.dark .blob-1 { background: radial-gradient(circle at 30% 30%, rgba(99,102,241,0.36), rgba(56,189,248,0.20) 58%, transparent 74%); }
    html.dark .blob-2 { background: radial-gradient(circle at 40% 40%, rgba(192,132,252,0.28), rgba(236,72,153,0.16) 58%, transparent 74%); }
    html.dark .blob-3 { background: radial-gradient(circle at 45% 45%, rgba(20,184,166,0.20), rgba(59,130,246,0.12) 58%, transparent 72%); }

    html.dark .theme-switch {
      background: rgba(15,23,42,0.6);
      border-color: rgba(255,255,255,0.14);
      color: #fde68a;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 8px 24px rgba(0,0,0,0.45);
    }
    html.dark .theme-switch:hover { background: rgba(30,41,59,0.8); }

    html.dark .login-card {
      background: rgba(15,23,42,0.55);
      border-color: rgba(255,255,255,0.13);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.24),
        inset 0 -1px 0 rgba(255,255,255,0.06),
        0 28px 72px rgba(0,0,0,0.58),
        0 4px 16px rgba(0,0,0,0.35);
    }
    html.dark .login-card::before { background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.03) 32%, transparent 62%); }
    html.dark .eyebrow { border-color: rgba(255,255,255,0.14); background: rgba(255,255,255,0.08); color: #cbd5e1; }
    html.dark .eyebrow::before { background: #818cf8; }
    html.dark .login-title { color: #fff; }
    html.dark .login-subtitle { color: #94a3b8; }
    html.dark label { color: #cbd5e1; }
    html.dark input[type="text"], html.dark input[type="password"] {
      border-color: rgba(255,255,255,0.13);
      background: rgba(255,255,255,0.08);
      color: #fff;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.06);
    }
    html.dark input:focus {
      background: rgba(255,255,255,0.12);
      border-color: rgba(129,140,248,0.65);
      box-shadow: 0 0 0 3.5px rgba(129,140,248,0.2);
    }
    html.dark button[type="submit"] {
      background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
      color: #0f172a;
      box-shadow: 0 10px 26px -4px rgba(0,0,0,0.45);
    }
    html.dark .error-message {
      background: rgba(185,28,28,0.28);
      border-color: rgba(252,165,165,0.3);
      color: #fca5a5;
    }
    html.dark .back-link { color: #94a3b8; }
    html.dark .back-link:hover { color: #fff; }

    /* 右上角双维度控制栏 */
    .top-controls {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .theme-switch {
      position: static;
      width: auto;
      min-width: 38px;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 600;
      gap: 4px;
    }

    /* 🎸 赛博朋克像素摇滚风格（支持浅色与深色） */
    html.cyber {
      --cb-bg: #ebe9e1;
      --cb-card: #ffffff;
      --cb-text: #090414;
      --cb-border: #090414;
    }
    html.cyber.dark {
      --cb-bg: #070210;
      --cb-card: #0e0520;
      --cb-text: #f0f6fc;
      --cb-border: #00f0ff;
    }
    html.cyber, html.cyber body {
      font-family: 'VT323', ui-monospace, 'Noto Sans SC', monospace !important;
      background: var(--cb-bg) !important;
      color: var(--cb-text) !important;
    }
    html.cyber *, html.cyber *::before, html.cyber *::after {
      border-radius: 0 !important;
    }
    html.cyber .login-card {
      background: var(--cb-card) !important;
      border: 2px solid var(--cb-border) !important;
      box-shadow: 7px 7px 0px #ff0055, -2px -2px 0px #fcee0a !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
    html.cyber .shield-icon, html.cyber .eyebrow, html.cyber #loginStyleToggle {
      background: #fcee0a !important;
      color: #090414 !important;
      border: 2px solid #090414 !important;
      box-shadow: 3px 3px 0px #ff0055 !important;
      font-weight: 800 !important;
    }
    html.cyber button[type="submit"] {
      background: #ff0055 !important;
      color: #ffffff !important;
      border: 2px solid #090414 !important;
      box-shadow: 4px 4px 0px #fcee0a !important;
      font-weight: 800 !important;
    }

    /* ⌘ 极客风格（支持极客浅色与极客深色） */
    html.omc {
      --omc-canvas: #f1f1f3;
      --omc-bg: #ffffff;
      --omc-surface: #f1f1f3;
      --omc-fg: #1c1c1e;
      --omc-muted: #787880;
      --omc-border: #dcdce1;
      --omc-accent: #005d8f;
    }
    html.omc.dark {
      --omc-canvas: #09090a;
      --omc-bg: #121214;
      --omc-surface: #1c1c1f;
      --omc-fg: #f4f4f6;
      --omc-muted: #71717a;
      --omc-border: #2c2c30;
      --omc-accent: #00a2fb;
    }
    html.omc, html.omc body {
      font-family: "Sarasa Mono SC", "Sarasa UI SC", "Sarasa Term SC", "更纱黑体 SC", "Berkeley Mono", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Noto Sans SC", monospace !important;
      background: var(--omc-canvas) !important;
      color: var(--omc-fg) !important;
    }
    html.omc .blobs, html.omc .login-card::before { display: none !important; }
    html.omc .login-card {
      background: var(--omc-bg) !important;
      border: 1px solid var(--omc-border) !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
    html.omc .shield-icon, html.omc button[type="submit"] {
      background: var(--omc-accent) !important;
      color: #ffffff !important;
      box-shadow: none !important;
    }
    html.omc input[type="text"], html.omc input[type="password"] {
      background: var(--omc-surface) !important;
      border: 1px solid var(--omc-border) !important;
      color: var(--omc-fg) !important;
      box-shadow: none !important;
    }
    html.omc input:focus {
      border-color: var(--omc-accent) !important;
      box-shadow: none !important;
    }
  </style>
</head>
<body>
  <!-- 环境极光弥散色球 -->
  <div class="blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- 双维度控制：风格（默认 | 摇滚） + 明暗（浅色 | 深色） -->
  <div class="top-controls">
    <button type="button" id="loginStyleToggle" class="theme-switch" aria-label="切换主题风格" title="切换默认、极客或摇滚风格">默认</button>
    <button type="button" id="loginThemeToggle" class="theme-switch" aria-label="切换浅色或深色模式" title="切换浅色/深色模式">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
    </button>
  </div>

  <!-- 流体玻璃 Bento 登录卡片 -->
  <div class="login-card">
    <div class="shield-icon" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
      </svg>
    </div>
    <h1 class="login-title">管理员登录</h1>
    <form method="post" action="/admin" novalidate>
      <div class="form-group">
        <label for="username">用户名</label>
        <div class="input-wrap">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          <input type="text" id="username" name="name" required autocomplete="username" placeholder="请输入管理员账号">
        </div>
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <div class="input-wrap">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="请输入登录密码">
        </div>
      </div>
      <div class="error-message">用户名或密码错误</div>
      <button type="submit">进入管理后台</button>
    </form>
    <a href="/" class="back-link">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      <span>返回导航首页</span>
    </a>
  </div>

  <script>
    (function() {
      var styleBtn = document.getElementById('loginStyleToggle');
      var themeBtn = document.getElementById('loginThemeToggle');
      // 登录页初始化或切换风格时，读取当前风格。
      function getStyleMode() {
        var root = document.documentElement;
        if (root.classList.contains('cyber')) return 'cyber';
        if (root.classList.contains('omc')) return 'omc';
        return 'default';
      }
      // 登录页初始化或风格变化后，同步按钮文字。
      function syncStyleText() {
        if (!styleBtn) return;
        var s = getStyleMode();
        styleBtn.textContent = s === 'cyber' ? '摇滚' : (s === 'omc' ? '极客' : '默认');
      }
      syncStyleText();
      if (styleBtn) {
        styleBtn.addEventListener('click', function() {
          var current = getStyleMode();
          var next = current === 'default' ? 'omc' : (current === 'omc' ? 'cyber' : 'default');
          var root = document.documentElement;
          root.classList.remove('omc', 'cyber');
          if (next !== 'default') root.classList.add(next);
          try { localStorage.setItem('nav-style', next); } catch (e) {}
          syncStyleText();
        });
      }
      if (themeBtn) {
        themeBtn.addEventListener('click', function() {
          var isDark = document.documentElement.classList.toggle('dark');
          try { localStorage.setItem('nav-theme', isDark ? 'dark' : 'light'); } catch (e) {}
        });
      }
    })();
  </script>
</body>
</html>

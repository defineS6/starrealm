<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星境书签 - 管理中心</title>
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('nav-theme');
        var savedStyle = localStorage.getItem('nav-style');
        if (savedTheme === 'cyber') {
          savedStyle = 'cyber';
          savedTheme = 'dark';
          localStorage.setItem('nav-style', 'cyber');
          localStorage.setItem('nav-theme', 'dark');
        }
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var root = document.documentElement;
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
        root.classList.remove('omc', 'cyber');
        if (savedStyle === 'omc' || savedStyle === 'cyber') {
          root.classList.add(savedStyle);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
</head>
<body>
  <div class="admin-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="container">
    <!-- 顶部导航栏 -->
    <header class="admin-header">
      <div class="header-brand">
        <div class="brand-badge" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
          </svg>
        </div>
        <div class="brand-text">
          <h1>星境书签管理中心</h1>
        </div>
      </div>

      <div class="header-actions">
        <div class="import-export">
          <input type="file" id="importFile" accept=".json" style="display:none;">
          <button type="button" id="importBtn" class="btn-secondary">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
            导入
          </button>
          <button type="button" id="exportBtn" class="btn-secondary">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
            导出
          </button>
        </div>
        <a href="/" class="home-link-btn" title="返回前台导航首页">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>
          前台首页
        </a>
        <button type="button" id="adminStyleToggle" class="theme-toggle-btn" title="切换主题风格（默认 / 极客 / 摇滚）" aria-label="切换主题风格">默认</button>
        <button type="button" id="adminThemeToggle" class="theme-toggle-btn" title="切换浅色/深色模式" aria-label="切换浅色/深色模式">切换明暗</button>
        <form method="post" action="/admin/logout" style="margin:0;">
          <button type="submit" class="logout-btn">退出</button>
        </form>
      </div>
    </header>

    <!-- 一体化控制栏：左侧页签切换 + 右侧搜索与新增按钮 -->
    <div class="control-bar">
      <div class="tab-buttons">
        <button class="tab-button active" data-tab="config">书签列表</button>
        <button class="tab-button" data-tab="pending">待审核列表</button>
        <button class="tab-button" data-tab="categories">分类管理</button>
        <button class="tab-button" data-tab="settings">站点设置</button>
      </div>
      <div class="toolbar-right" id="toolbarRight">
        <button type="button" id="toggleAddPanelBtn" class="btn-primary-action">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
          <span>新增书签</span>
        </button>
      </div>
    </div>

    <!-- 可折叠的新增书签表单面板（告别单行拥挤排布） -->
    <div class="add-new" id="addNewPanel">
      <div class="add-new-header">
        <span class="add-new-title">快速添加新书签</span>
        <button type="button" id="closeAddPanelBtn" class="add-new-close" title="收起面板">&times;</button>
      </div>
      <div class="add-new-grid">
        <div class="field-item">
          <label for="addName">站点名称 *</label>
          <input type="text" id="addName" placeholder="例如：GitHub" required>
        </div>
        <div class="field-item">
          <label for="addUrl">站点网址 *</label>
          <input type="text" id="addUrl" placeholder="https://github.com" required>
        </div>
        <div class="field-item">
          <label for="addCatelog">所属分类 *</label>
          <select id="addCatelog" required title="选择分类">
            <option value="">加载分类中...</option>
          </select>
        </div>
        <div class="field-item">
          <label for="addLogo">图标链接</label>
          <input type="text" id="addLogo" placeholder="https://.../favicon.ico">
        </div>
        <div class="field-item field-desc">
          <label for="addDesc">站点描述</label>
          <input type="text" id="addDesc" placeholder="站点简介（可选）">
        </div>
        <div class="field-item field-sort">
          <label for="addSortOrder">排序权重</label>
          <input type="number" id="addSortOrder" placeholder="默认 9999">
        </div>
        <div class="field-item field-submit">
          <label>&nbsp;</label>
          <button id="addBtn" type="button">确认添加</button>
        </div>
      </div>
    </div>

    <div id="message" style="display: none;"></div>

    <!-- 主内容与表格区 -->
    <div class="tab-wrapper">
      <div id="config" class="tab-content active">
        <div class="table-wrapper">
          <div class="table-scroll">
            <table id="configTable">
              <thead>
                <tr>
                  <th style="width: 68px;">ID</th>
                  <th style="width: 180px;">站点名称</th>
                  <th style="width: 220px;">网址链接</th>
                  <th style="width: 64px;">图标</th>
                  <th>站点描述</th>
                  <th style="width: 120px;">所属分类</th>
                  <th style="width: 84px;">排序</th>
                  <th style="width: 136px;">操作</th>
                </tr>
              </thead>
              <tbody id="configTableBody">
              </tbody>
            </table>
          </div>
          <div class="pagination">
            <button id="prevPage" disabled>上一页</button>
            <span class="page-indicator">第 <span id="currentPage">1</span> / <span id="totalPages">1</span> 页</span>
            <button id="nextPage" disabled>下一页</button>
          </div>
        </div>
      </div>

      <div id="pending" class="tab-content">
        <div class="table-wrapper">
          <div class="table-scroll">
            <table id="pendingTable">
              <thead>
                <tr>
                  <th style="width: 68px;">ID</th>
                  <th style="width: 180px;">站点名称</th>
                  <th style="width: 240px;">网址链接</th>
                  <th style="width: 64px;">图标</th>
                  <th>站点描述</th>
                  <th style="width: 120px;">所属分类</th>
                  <th style="width: 140px;">操作</th>
                </tr>
              </thead>
              <tbody id="pendingTableBody">
              </tbody>
            </table>
          </div>
          <div class="pagination">
            <button id="pendingPrevPage" disabled>上一页</button>
            <span class="page-indicator">第 <span id="pendingCurrentPage">1</span> / <span id="pendingTotalPages">1</span> 页</span>
            <button id="pendingNextPage" disabled>下一页</button>
          </div>
        </div>
      </div>

      <div id="categories" class="tab-content">
        <div class="table-wrapper">
          <div class="category-toolbar">
            <div class="category-create-bar">
              <input type="text" id="newCategoryName" placeholder="输入新分类名称 (如：开发工具)" maxlength="50">
              <input type="number" id="newCategorySort" placeholder="排序权重 (默认 9999)">
              <button type="button" id="createCategoryBtn" class="category-create-btn">+ 创建分类</button>
            </div>
            <div class="category-hint-row">
              <!-- 排序数字越小越靠前；新建分类会出现在书签表单的下拉选项中。 -->
              <button id="refreshCategories" type="button" class="btn-secondary">刷新列表</button>
            </div>
          </div>
          <div class="table-scroll">
            <table id="categoryTable">
              <thead>
                <tr>
                  <th style="width: 240px;">分类名称</th>
                  <th style="width: 140px;">关联书签数</th>
                  <th style="width: 260px;">排序权重</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="categoryTableBody">
                <tr><td colspan="4">加载中...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div id="settings" class="tab-content">
        <div class="settings-wrapper">
          <div class="settings-card">
            <h2 class="settings-title">侧边栏入口</h2>
            <form id="settingsForm" class="settings-form">
              <div class="settings-field">
                <label for="settingBlogEnabled">博客入口</label>
                <select id="settingBlogEnabled">
                  <option value="true">显示</option>
                  <option value="false">隐藏</option>
                </select>
              </div>
              <div class="settings-field">
                <label for="settingBlogUrl">博客链接</label>
                <input type="text" id="settingBlogUrl" placeholder="https://...">
              </div>
              <div class="settings-field">
                <label for="settingGitEnabled">仓库入口</label>
                <select id="settingGitEnabled">
                  <option value="true">显示</option>
                  <option value="false">隐藏</option>
                </select>
              </div>
              <div class="settings-field">
                <label for="settingGitUrl">仓库链接</label>
                <input type="text" id="settingGitUrl" placeholder="https://github.com/...">
              </div>
              <div class="settings-actions">
                <button type="submit" id="saveSettingsBtn" class="btn-primary-action">保存设置</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/static/admin.js"></script>
</body>
</html>
